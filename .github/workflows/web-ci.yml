name: Web CI

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'quickcart-web-enterprise/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'quickcart-web-enterprise/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Build and test web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: quickcart-web-enterprise/package-lock.json

      - name: Install dependencies
        working-directory: quickcart-web-enterprise
        run: npm ci

      - name: Run web tests
        working-directory: quickcart-web-enterprise
        run: npm test
