      - name: Install Flutter SDK (git clone)
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          # Ensure the runner uses this flutter in subsequent steps:
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          # Also export it in this step for immediate commands:
          export PATH="$HOME/flutter/bin:$PATH"

          # Basic checks
          $HOME/flutter/bin/flutter --version
          $HOME/flutter/bin/flutter doctor -v || true

          # Pre-download artifacts; fail early if this fails
          $HOME/flutter/bin/flutter precache
        shell: bash

      - name: Debug Flutter env
        run: |
          echo "GITHUB_PATH:"
          sed -n '1,200p' $GITHUB_PATH || true
          echo "PATH=$PATH"
          echo "which flutter: $(which flutter || echo 'not found')"
          $HOME/flutter/bin/flutter --version || true
          ls -la $HOME/flutter || true
        shell: bash

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.flutter/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        working-directory: quickcart-app
        run: $HOME/flutter/bin/flutter pub get
        shell: bash

      - name: Run tests
        working-directory: quickcart-app
        run: $HOME/flutter/bin/flutter test --no-pub
        shell: bash
