name: Backend CI

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'quickcart-backend-enterprise/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'quickcart-backend-enterprise/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        working-directory: quickcart-backend-enterprise
        run: npm ci

      - name: Build backend
        working-directory: quickcart-backend-enterprise
        run: npm run build

      - name: Run backend tests
        working-directory: quickcart-backend-enterprise
        run: npm test
