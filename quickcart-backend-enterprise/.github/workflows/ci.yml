name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quickcart
          POSTGRES_PASSWORD: quickcart
          POSTGRES_DB: quickcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://quickcart:quickcart@localhost:5432/quickcart
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
